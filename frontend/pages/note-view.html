<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Note – NoteSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/logout-feature.css"/>
  <link rel="stylesheet" href="../css/header-enhanced.css"/>
  <link rel="stylesheet" href="../css/note-view.css"/>

  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <!-- PDF.js for PDF text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    /* PDF Viewer Embed Styles */
    .pdf-embed-container {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 16px;
    }

    .pdf-embed-frame {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    .image-viewer {
      width: 100%;
      max-width: 100%;
      border-radius: var(--radius-lg);
      margin-top: 16px;
      border: 1px solid var(--border);
    }

    .file-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .file-action-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: var(--text-primary);
    }

    .file-action-card:hover {
      border-color: var(--accent);
      background: var(--accent-subtle);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .file-action-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .file-action-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .file-action-desc {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
<nav class="navbar">
  <button class="mobile-menu-btn" id="mobile-menu-btn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="navbar-search">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Search…"/>
  </div>
  <div class="navbar-right">
    <a href="upload.html" class="btn btn-primary btn-sm">+ New Note</a>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="app-layout">
  <main class="main-content" id="main-content">
    <div class="empty-state"><div class="spinner lg"></div></div>
  </main>
</div>

<script src="../js/app.js"></script>
<script src="../js/note-view.js"></script>
</body>
</html>

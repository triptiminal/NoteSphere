<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoteShare – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="../css/logout-feature.css"/>
  <link rel="stylesheet" href="../css/header-enhanced.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-wrap { width:100%; max-width:440px; padding:16px; }
    .auth-logo { text-align:center; margin-bottom:32px; }
    .auth-logo .logo-icon-lg {
      width:64px; height:64px; border-radius:20px; margin:0 auto 12px;
      background:linear-gradient(135deg,var(--accent),#a855f7);
      display:flex; align-items:center; justify-content:center; font-size:30px;
      box-shadow:var(--shadow-glow);
    }
    .auth-logo h1 { font-size:1.8rem; }
    .auth-logo p  { color:var(--text-muted); font-size:14px; margin-top:4px; }
    .auth-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-xl); padding:32px; }
    .auth-tabs { display:flex; gap:4px; background:var(--bg-input); border-radius:var(--radius-md); padding:4px; margin-bottom:24px; }
    .auth-tab  { flex:1; text-align:center; padding:8px; border-radius:8px; font-size:14px; font-weight:600;
                 color:var(--text-muted); cursor:pointer; transition:all .2s; }
    .auth-tab.active { background:var(--bg-card); color:var(--text-primary); box-shadow:var(--shadow-sm); }
    .auth-form { display:flex; flex-direction:column; gap:16px; }
    .auth-form.hidden { display:none; }
    .bg-mesh {
      position:fixed; inset:0; z-index:-1;
      background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(124,106,247,.12) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 70%, rgba(168,85,247,.08) 0%, transparent 60%),
                  var(--bg-base);
    }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="auth-wrap">
  <div class="auth-logo fade-up">
<!--    <div class="logo-icon-lg"></div>-->
    <h1>NoteSphere</h1>
    <p>Collaborative Academic Notes Platform</p>
  </div>

  <div class="auth-card fade-up" style="animation-delay:.1s">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login">Login</div>
      <div class="auth-tab" id="tab-register">Register</div>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="login-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" placeholder="Your password" required/>
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn">
        <span id="login-btn-text">Sign In</span>
        <span id="login-spinner" class="spinner hidden"></span>
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form class="auth-form hidden" id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="reg-name" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="reg-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-password" placeholder="At least 6 characters" required minlength="6"/>
      </div>
      <div id="reg-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-lg w-full" id="reg-btn">
        <span id="reg-btn-text">Create Account</span>
        <span id="reg-spinner" class="spinner hidden"></span>
      </button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = 'pages/dashboard.html';

  // Tab switching
  document.getElementById('tab-login').addEventListener('click', () => {
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('register-form').classList.add('hidden');
  });
  document.getElementById('tab-register').addEventListener('click', () => {
    document.getElementById('tab-register').classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('register-form').classList.remove('hidden');
    document.getElementById('login-form').classList.add('hidden');
  });

  // Login
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const txt = document.getElementById('login-btn-text');
    const spin = document.getElementById('login-spinner');
    const err = document.getElementById('login-error');
    err.classList.add('hidden');
    btn.disabled = true; txt.textContent = 'Signing in…'; spin.classList.remove('hidden');
    const res = await api.post('/auth/login', {
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
    btn.disabled = false; txt.textContent = 'Sign In'; spin.classList.add('hidden');
    if (res && res.ok) {
      const d = res.data.data;
      Auth.setSession(d.token, { id: d.id, name: d.name, email: d.email, role: d.role, avatarColor: d.avatarColor, contributorScore: d.contributorScore });
      window.location.href = 'pages/dashboard.html';
    } else {
      err.textContent = res?.data?.message || 'Login failed';
      err.classList.remove('hidden');
    }
  });

  // Register
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    const txt = document.getElementById('reg-btn-text');
    const spin = document.getElementById('reg-spinner');
    const err = document.getElementById('reg-error');
    err.classList.add('hidden');
    btn.disabled = true; txt.textContent = 'Creating…'; spin.classList.remove('hidden');
    const res = await api.post('/auth/register', {
      name: document.getElementById('reg-name').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value
    });
    btn.disabled = false; txt.textContent = 'Create Account'; spin.classList.add('hidden');
    if (res && res.ok) {
      const d = res.data.data;
      Auth.setSession(d.token, { id: d.id, name: d.name, email: d.email, role: d.role, avatarColor: d.avatarColor, contributorScore: d.contributorScore });
      window.location.href = 'pages/dashboard.html';
    } else {
      err.textContent = res?.data?.message || 'Registration failed';
      err.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
